<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasuku Board - Googleログイン対応</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Firebase SDK (v10 compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: { 500: '#3b82f6', 600: '#2563eb' } }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200">
  <div id="app" class="max-w-7xl mx-auto px-4 py-6">
    
    <!-- ヘッダー -->
    <header class="flex flex-col lg:flex-row items-center justify-between pb-6 border-b border-slate-200 dark:border-slate-800 gap-4">
      <div class="flex items-center justify-between w-full lg:w-auto">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-500/20">
            <i data-lucide="layout-dashboard" class="w-6 h-6"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold tracking-tight leading-none text-indigo-600 dark:text-indigo-400">Tasuku Board</h1>
            <span class="text-[10px] font-bold text-slate-400 tracking-wider">KANBAN & GOOGLE AUTH</span>
          </div>
        </div>

        <button id="themeToggleMobile" class="lg:hidden p-2 text-slate-500 dark:text-slate-400 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-800">
          <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
          <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
        </button>
      </div>

      <!-- アカウント / ログイン状態エリア -->
      <div class="flex items-center gap-3 w-full lg:w-auto justify-end">
        <button id="themeToggle" class="hidden lg:block p-2.5 text-slate-500 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-xl transition">
          <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
          <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
        </button>

        <!-- 未ログイン状態の表示 -->
        <div id="loggedOutUI" class="flex items-center gap-2">
          <button onclick="loginWithGoogle()" class="flex items-center gap-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-semibold px-3 py-2 rounded-xl transition shadow-sm">
            <svg class="w-4 h-4" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Googleでログイン
          </button>
        </div>

        <!-- ログイン済み状態の表示 -->
        <div id="loggedInUI" class="hidden items-center gap-3">
          <div class="flex items-center gap-2">
            <img id="userAvatar" src="" class="w-8 h-8 rounded-full border border-slate-200 dark:border-slate-700">
            <div class="text-left hidden sm:block">
              <div id="userName" class="text-xs font-bold leading-none"></div>
              <div id="userEmail" class="text-[10px] text-slate-400 mt-0.5"></div>
            </div>
          </div>
          <button onclick="logout()" title="ログアウト" class="p-2 text-slate-400 hover:text-rose-500 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition">
            <i data-lucide="log-out" class="w-4 h-4"></i>
          </button>
        </div>

        <button onclick="openModal()" class="flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs px-4 py-2.5 rounded-xl transition shadow-md shadow-indigo-500/20">
          <i data-lucide="plus" class="w-4 h-4"></i> タスク追加
        </button>
      </div>
    </header>

    <!-- 検索バー -->
    <div class="my-4 flex items-center justify-between gap-3">
      <div class="relative flex-1 max-w-sm">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="searchInput" oninput="render()" placeholder="ボード内を検索..." class="w-full pl-9 pr-3 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
    </div>

    <!-- カンバンボード領域 -->
    <main class="grid grid-cols-1 md:grid-cols-3 gap-5 items-start">
      <!-- 未着手 (To Do) -->
      <div class="bg-slate-200/60 dark:bg-slate-800/60 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700/50 flex flex-col min-h-[450px]">
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-300/60 dark:border-slate-700/60">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-blue-500"></span>
            <h3 class="text-sm font-bold">未着手</h3>
            <span id="countTodo" class="px-2 py-0.5 rounded-full bg-slate-300 dark:bg-slate-700 text-[10px] font-bold">0</span>
          </div>
        </div>
        <div id="columnTodo" class="space-y-3 flex-1"></div>
      </div>

      <!-- 進行中 (In Progress) -->
      <div class="bg-slate-200/60 dark:bg-slate-800/60 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700/50 flex flex-col min-h-[450px]">
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-300/60 dark:border-slate-700/60">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-amber-500"></span>
            <h3 class="text-sm font-bold">進行中</h3>
            <span id="countDoing" class="px-2 py-0.5 rounded-full bg-slate-300 dark:bg-slate-700 text-[10px] font-bold">0</span>
          </div>
        </div>
        <div id="columnDoing" class="space-y-3 flex-1"></div>
      </div>

      <!-- 完了 (Done) -->
      <div class="bg-slate-200/60 dark:bg-slate-800/60 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700/50 flex flex-col min-h-[450px]">
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-300/60 dark:border-slate-700/60">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
            <h3 class="text-sm font-bold">完了</h3>
            <span id="countDone" class="px-2 py-0.5 rounded-full bg-slate-300 dark:bg-slate-700 text-[10px] font-bold">0</span>
          </div>
        </div>
        <div id="columnDone" class="space-y-3 flex-1"></div>
      </div>
    </main>
  </div>

  <!-- タスクモーダル -->
  <div id="taskModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100 dark:border-slate-700">
      <div class="flex items-center justify-between mb-4">
        <h3 id="modalTitleText" class="text-base font-bold">新しいカードを追加</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form id="taskForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <input type="hidden" id="editTaskId">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">タイトル *</label>
          <input type="text" id="taskTitle" required placeholder="タスク名を入力..." class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">ステータス</label>
            <select id="taskStatus" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:outline-none">
              <option value="todo">未着手</option>
              <option value="doing">進行中</option>
              <option value="done">完了</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">優先度</label>
            <select id="taskPriority" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:outline-none">
              <option value="high">🔴 高</option>
              <option value="medium" selected>🟡 中</option>
              <option value="low">🔵 低</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">詳細メモ</label>
          <textarea id="taskDesc" rows="3" placeholder="詳細情報..." class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:outline-none"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-2 border-t border-slate-100 dark:border-slate-700">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs font-medium text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition">キャンセル</button>
          <button type="submit" class="px-4 py-2 text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl transition">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // ----------------------------------------------------
    // 【1】 Firebase設定 (ご自身のFirebaseプロジェクト情報に書き換えてください)
    // ----------------------------------------------------
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Firebase 初期化
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // ----------------------------------------------------
    // 【2】 アプリ状態とデータ管理
    // ----------------------------------------------------
    let currentUser = null;
    let tasks = [];

    // 認証状態の監視
    auth.onAuthStateChanged(user => {
      currentUser = user;
      const loggedOutUI = document.getElementById('loggedOutUI');
      const loggedInUI = document.getElementById('loggedInUI');

      if (user) {
        // ログイン時
        loggedOutUI.classList.add('hidden');
        loggedInUI.classList.remove('hidden');
        loggedInUI.classList.add('flex');

        document.getElementById('userName').textContent = user.displayName || 'ユーザー';
        document.getElementById('userEmail').textContent = user.email || '';
        document.getElementById('userAvatar').src = user.photoURL || 'https://via.placeholder.com/32';

        // ユーザー固有のタスクを読み込み
        loadTasks();
      } else {
        // 未ログイン時
        loggedOutUI.classList.remove('hidden');
        loggedInUI.classList.add('hidden');
        loggedInUI.classList.remove('flex');

        // ゲスト用タスク読み込み
        loadTasks();
      }
    });

    // Googleログイン実行
    function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(error => {
        alert("ログインエラー: " + error.message);
      });
    }

    // ログアウト実行
    function logout() {
      auth.signOut().then(() => {
        render();
      });
    }

    // ストレージキー（ログインユーザーごとに別々に保存）
    function getStorageKey() {
      return currentUser ? `tasuku_tasks_${currentUser.uid}` : 'tasuku_tasks_guest';
    }

    function loadTasks() {
      tasks = JSON.parse(localStorage.getItem(getStorageKey()) || '[]');
      render();
    }

    function saveTasks() {
      localStorage.setItem(getStorageKey(), JSON.stringify(tasks));
      render();
    }

    // ----------------------------------------------------
    // 【3】 UI & テーマ設定
    // ----------------------------------------------------
    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
    });

    function initTheme() {
      if (localStorage.getItem('tasuku_theme') === 'dark' || (!('tasuku_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    }
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('tasuku_theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    }
    document.getElementById('themeToggle').addEventListener('click', toggleTheme);
    document.getElementById('themeToggleMobile').addEventListener('click', toggleTheme);

    // モーダル操作
    function openModal(taskId = null) {
      const modal = document.getElementById('taskModal');
      const form = document.getElementById('taskForm');
      form.reset();

      if (taskId) {
        const task = tasks.find(t => t.id === taskId);
        if (task) {
          document.getElementById('editTaskId').value = task.id;
          document.getElementById('taskTitle').value = task.title;
          document.getElementById('taskStatus').value = task.status;
          document.getElementById('taskPriority').value = task.priority;
          document.getElementById('taskDesc').value = task.desc || '';
        }
      } else {
        document.getElementById('editTaskId').value = '';
      }
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      const modal = document.getElementById('taskModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const editId = document.getElementById('editTaskId').value;
      const title = document.getElementById('taskTitle').value.trim();
      const status = document.getElementById('taskStatus').value;
      const priority = document.getElementById('taskPriority').value;
      const desc = document.getElementById('taskDesc').value.trim();

      if (editId) {
        tasks = tasks.map(t => t.id === editId ? { ...t, title, status, priority, desc } : t);
      } else {
        tasks.unshift({
          id: Date.now().toString(),
          title,
          status,
          priority,
          desc,
          createdAt: new Date().toISOString()
        });
      }
      saveTasks();
      closeModal();
    }

    function moveTask(id, targetStatus) {
      tasks = tasks.map(t => t.id === id ? { ...t, status: targetStatus } : t);
      saveTasks();
    }

    function deleteTask(id) {
      if (confirm('このタスクを削除しますか？')) {
        tasks = tasks.filter(t => t.id !== id);
        saveTasks();
      }
    }

    // 描画
    function render() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const filtered = tasks.filter(t => t.title.toLowerCase().includes(search) || (t.desc && t.desc.toLowerCase().includes(search)));

      const todoList = filtered.filter(t => t.status === 'todo');
      const doingList = filtered.filter(t => t.status === 'doing');
      const doneList = filtered.filter(t => t.status === 'done');

      document.getElementById('countTodo').textContent = todoList.length;
      document.getElementById('countDoing').textContent = doingList.length;
      document.getElementById('countDone').textContent = doneList.length;

      document.getElementById('columnTodo').innerHTML = renderCards(todoList, 'todo');
      document.getElementById('columnDoing').innerHTML = renderCards(doingList, 'doing');
      document.getElementById('columnDone').innerHTML = renderCards(doneList, 'done');

      lucide.createIcons();
    }

    function renderCards(cardList, colType) {
      if (cardList.length === 0) {
        return `<div class="h-20 flex items-center justify-center border-2 border-dashed border-slate-300/60 dark:border-slate-700/60 rounded-xl text-xs text-slate-400">タスクなし</div>`;
      }
      return cardList.map(t => `
        <div class="bg-white dark:bg-slate-800 p-3.5 rounded-xl border border-slate-200/80 dark:border-slate-700/70 shadow-sm transition group">
          <div class="flex items-start justify-between gap-2">
            <h4 class="text-xs font-bold text-slate-800 dark:text-slate-100 ${t.status === 'done' ? 'line-through text-slate-400' : ''}">${escapeHtml(t.title)}</h4>
            <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition">
              <button onclick="openModal('${t.id}')" class="p-1 text-slate-400 hover:text-indigo-500"><i data-lucide="edit-2" class="w-3.5 h-3.5"></i></button>
              <button onclick="deleteTask('${t.id}')" class="p-1 text-slate-400 hover:text-rose-500"><i data-lucide="trash" class="w-3.5 h-3.5"></i></button>
            </div>
          </div>
          ${t.desc ? `<p class="text-[11px] text-slate-500 dark:text-slate-400 mt-1.5">${escapeHtml(t.desc)}</p>` : ''}
          <div class="flex items-center justify-between mt-3 pt-2 border-t border-slate-100 dark:border-slate-700/50 text-[10px]">
            <span class="text-slate-400">${new Date(t.createdAt).toLocaleDateString('ja-JP')}</span>
            <div class="flex gap-1">
              ${colType !== 'todo' ? `<button onclick="moveTask('${t.id}', '${colType === 'done' ? 'doing' : 'todo'}')" class="px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-700">←</button>` : ''}
              ${colType !== 'done' ? `<button onclick="moveTask('${t.id}', '${colType === 'todo' ? 'doing' : 'done'}')" class="px-2 py-0.5 rounded bg-indigo-50 text-indigo-600 font-bold">→</button>` : ''}
            </div>
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }
  </script>
</body>
</html>
